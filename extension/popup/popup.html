<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Claude Auth Helper</title>
  <style>
    body{width:340px;font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial; padding:14px;color:#0b3}
    label{display:block;margin-bottom:6px;font-weight:600}
    input[type="text"]{width:100%;padding:8px;border-radius:6px;border:1px solid #ccc;background:#04120a;color:#fff}
    button{margin-top:10px;width:100%;padding:10px;border-radius:8px;border:none;cursor:pointer}
    .btn-save{background:#10b981;color:#fff}
    .btn-export{background:#059669;color:#fff}
    .note{font-size:12px;color:#98bfae;margin-top:8px}
  </style>
</head>
<body>
  <label for="apiKey">Anthropic / Claude API Key</label>
  <input id="apiKey" type="text" placeholder="输入或粘贴你的 Claude API Key" />
  <button id="saveBtn" class="btn-save">保存到本地（仅浏览器）</button>
  <button id="exportBtn" class="btn-export">导出为 auth.json</button>
  <div class="note">导出的 auth.json 可放到 claude 后端配置目录（本地）用于演示或开发。</div>

  <script src="popup.js"></script>
</body>
</html>
